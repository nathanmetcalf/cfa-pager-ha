name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # The HACS action reads hacs.json and the manifest over unauthenticated HTTP, which
    # returns nothing for a private repository, so both content checks fail with
    # "expected a dictionary. Got None" no matter what those files contain. It only has
    # anything to say once the repository is public, which is also the only state in which
    # anyone can install from it. Remove this condition when the repo goes public.
    if: github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brands check requires the integration to be listed in the
          # home-assistant/brands repository, which is a pull request against a repo we do
          # not own and only matters for inclusion in the default HACS store.
          ignore: brands
