# CFA Pager Radio dashboard, reproducing the Raspberry Pi wall display.
#
# Saved with: tools/ha_dashboard.py save cfa-radio dashboards/cfa_radio.yaml
#
# Requires layout-card (thomasloven/lovelace-layout-card), registered as a Lovelace
# resource. Everything else, radar included, comes from the integration itself. The built-in sections and masonry views cannot do this layout: both are
# auto-packers with fixed-width columns, so column spans produce staircase gaps and a short
# card leaves a hole. The Pi display was a CSS grid with fixed rows filling the viewport,
# and custom:grid-layout is the only way to express that.
#
# Card content MUST use a literal block scalar (|), never folded (>-). A folded scalar joins
# lines with spaces, which destroys the newlines Markdown tables need.
#
# Each grid area holds exactly one card, so a heading plus its table is a vertical-stack.
_title: CFA Pager Radio
_icon: mdi:fire-truck

# Handled by kiosk-mode (NemesisRE/kiosk-mode), already a registered resource. Scoped to
# the Kiosk user, which is what the wall display logs in as, so a phone or laptop keeps
# its normal navigation.
#
# The header stays: the row heights below subtract its 56px, so hiding it would leave an
# equal gap at the bottom rather than gaining any space.
kiosk_mode:
  user_settings:
    - users:
        - Kiosk
      hide_sidebar: true

views:
  - title: Radio
    path: radio
    type: custom:grid-layout
    layout:
      # Two columns, as on the Pi: callouts over traffic on the left, incidents over radar
      # on the right. Fire danger and fire weather live in the status row, where the Pi had
      # them, rather than as a panel of their own.
      #
      # minmax(0, ...) lets a track shrink below its content's minimum width. Plain fr
      # tracks refuse to, and the radar image's intrinsic size then pushes the whole grid
      # wider than the viewport.
      # The radar is a square image that scales with its column, so the row holding it is
      # sized from that column's width rather than a fraction of the leftover height:
      # 100vw / 3.3 tracks is about 30.3vw, plus 36px for the heading above it. The table
      # rows then take whatever is left. Both track sizes are viewport-relative, so the
      # whole display fits any resolution instead of overflowing at some of them.
      grid-template-columns: minmax(0, 2.3fr) minmax(0, 1fr)
      grid-template-rows: auto auto minmax(0, 1fr) calc(30.3vw + 36px)
      grid-template-areas: |
        "header header"
        "status status"
        "callouts incidents"
        "traffic radar"
      height: calc(100vh - 56px)
      # A track rounding up by a pixel must not produce a scrollbar on a wall display.
      overflow: hidden
      grid-gap: 8px
      padding: 8px
      mediaquery:
        # A short screen cannot afford a radar sized off a wide column, so the column
        # narrows and the row follows it, keeping the cell square and the tables usable.
        "(max-height: 900px)":
          grid-template-columns: minmax(0, 3.6fr) minmax(0, 1fr)
          grid-template-rows: auto auto minmax(0, 1fr) calc(22vw + 36px)
          grid-template-areas: |
            "header header"
            "status status"
            "callouts incidents"
            "traffic radar"
          height: calc(100vh - 56px)
          overflow: hidden
          grid-gap: 8px
          padding: 8px
        # One column on a phone, in reading order. Listed last so it wins over the
        # height rule on a phone held upright.
        "(max-width: 1000px)":
          grid-template-columns: minmax(0, 1fr)
          grid-template-rows: auto auto auto auto auto auto
          grid-template-areas: |
            "header"
            "status"
            "callouts"
            "incidents"
            "traffic"
            "radar"
          height: auto

    cards:
      # ---- header and alerts ------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-area: header
        cards:
          - type: markdown
            text_only: true
            content: |
              ## CFA Pager Radio &nbsp; · &nbsp; {{ now().strftime('%H:%M') }}
              {%- set watching = state_attr('sensor.cfa_pager_last_callout','watching') or [] %}
              Watching {{ watching | count }}: {{ watching | map('regex_replace','\s*\(\d+\)','') | join(' · ') }}

          - type: markdown
            visibility:
              - condition: template
                value_template: >-
                  {% set last = states('sensor.cfa_pager_last_callout') %}
                  {{ last not in ['unknown','unavailable'] and
                     (now() - as_datetime(last)).total_seconds() < 900 }}
            content: |
              {%- set c = (state_attr('sensor.cfa_pager_last_callout','callouts') or [{}])[0] %}
              # 🔴 CALLOUT — {{ c.get('brigade','') }}
              ### {{ c.get('text','') }}

          - type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.cfa_pager_feed_connected
                state: "off"
            content: |
              # ⚠️ Pager feed disconnected
              Callouts are being missed.

          - type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.cfa_pager_feed_stale
                state: "on"
            content: |
              ### ⚠️ Pager feed stale
              Nothing has arrived for over 30 minutes.

      # ---- status tiles -----------------------------------------------------------
      - type: grid
        view_layout:
          grid-area: status
        columns: 8
        square: false
        cards:
          - type: tile
            entity: sensor.cfa_pager_callouts_today
            name: Callouts today
            icon: mdi:fire-truck
            color: red
          - type: tile
            entity: sensor.cfa_pager_last_callout
            name: Last callout
            icon: mdi:clock-alert-outline
            color: amber
          - type: tile
            entity: binary_sensor.cfa_pager_feed_connected
            name: Feed
            icon: mdi:radio-tower
            color: green
          - type: tile
            entity: sensor.cfa_pager_pages_seen
            name: Pages seen
            icon: mdi:message-text-outline
            color: blue
          - type: tile
            entity: sensor.wartook_forcast_fire_danger_0
            name: Fire danger
            icon: mdi:fire-alert
            color: orange
          # Not a tile: a tile shows one value, and the Pi's fire weather tile carried a
          # headline plus a line of detail. A small Markdown card is the closest match.
          - type: markdown
            content: |
              {%- set w = 'weather.wartook' %}
              **{{ state_attr(w,'temperature') | round(1) }}° &nbsp; {{ state_attr(w,'humidity') }}%**
              {{ state_attr(w,'wind_bearing') }} {{ state_attr(w,'wind_speed') | round(0) }} km/h · rain {{ states('sensor.wartook_forcast_rain_chance_0') }}%
          # Controls, in the same row as the readouts: listen, which district, how loud.
          # select-options renders the districts as chips, so switching is one tap rather
          # than a dropdown.
          - type: tile
            entity: select.cfa_pager_stream
            name: District
            icon: mdi:radio
            color: blue
            features:
              - type: select-options
          # Tapping the icon toggles the listen switch rather than the player itself,
          # because the switch is what picks the stream and holds the idle window open.
          # The state line under it is the player's own, so it reads Playing or Idle.
          - type: tile
            entity: media_player.cfa_radio
            name: Radio
            icon: mdi:play-pause
            color: purple
            icon_tap_action:
              action: perform-action
              perform_action: switch.toggle
              target:
                entity_id: switch.cfa_pager_listen
            features:
              - type: media-player-volume-slider

      # ---- your callouts ----------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-area: callouts
        cards:
          - type: heading
            heading: Your callouts
            heading_style: title
            icon: mdi:fire-truck
          - type: markdown
            content: |
              {%- set limit = 6 %}
              {%- set callouts = (state_attr('sensor.cfa_pager_last_callout','callouts') or [])[:limit] %}
              {% if callouts -%}
              | Time | Brigade | Message |
              |:--|:--|:--|
              {% for c in callouts -%}
              | {{ c.ts | timestamp_custom('%d %b %H:%M') }} | 🔴 **{{ c.brigade or c.description }}** | {{ c.text }} |
              {% endfor %}
              {%- else -%}
              _No callouts recorded._
              {%- endif %}

      # ---- nearby incidents -------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-area: incidents
        cards:
          - type: heading
            heading: Going incidents near you
            heading_style: title
            icon: mdi:map-marker-alert
          - type: markdown
            content: |
              {%- set e = 'sensor.cfa_pager_nearby_incidents' %}
              {%- set rows = state_attr(e,'incidents') or [] %}
              {% if rows -%}
              | Dist | Type | Location |
              |:--|:--|:--|
              {% for r in rows[:12] -%}
              | **{{ r.km }}km {{ r.dir }}** | {% if 'fire' in (r.category ~ ' ' ~ r.name) | lower %}🔴{% else %}🔵{% endif %} {{ (r.category or r.feed_type)[:16] }} | {{ (r.location or r.name)[:36] }} |
              {% endfor %}
              {%- else -%}
              _Nothing going within {{ state_attr(e,'radius_km') }} km._
              {%- endif %}

      # ---- all pager traffic ------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-area: traffic
        cards:
          - type: heading
            heading: All pager traffic
            heading_style: title
            icon: mdi:format-list-bulleted
          # A Markdown table is only as wide as its content, and the message is the only
          # column that can grow, so the trim length is what decides whether the table
          # fills the card. The station name is capped as well, because a long one steals
          # width from the message and wraps the row onto two lines.
          #
          # A YAML comment cannot go inside the block scalar below: it would render as a
          # Markdown heading.
          - type: markdown
            content: |
              {%- set limit = 12 %}
              {%- set trim = 124 %}
              {%- set station_trim = 20 %}
              {%- set dots = {'CFA':'🔵','SES':'🟠','FRV':'🟢'} %}
              {%- set pages = (state_attr('sensor.cfa_pager_recent_pages','pages') or [])[:limit] %}
              {% if pages -%}
              | Time | Agency | Station | Message |
              |:--|:--|:--|:--|
              {% for p in pages -%}
              | {{ p.ts | timestamp_custom('%H:%M:%S') }} | {{ dots.get(p.agency,'⚪') }} {{ p.agency }} | **{{ (p.description or p.alphacode or p.capcode)[:station_trim] }}{% if (p.description or '') | length > station_trim %}…{% endif %}** | {{ p.text[:trim] }}{% if p.text | length > trim %}…{% endif %} |
              {% endfor %}
              {%- else -%}
              _Nothing received yet._
              {%- endif %}

      # ---- rain radar -------------------------------------------------------------
      - type: vertical-stack
        view_layout:
          grid-area: radar
        cards:
          - type: heading
            heading: Rain radar
            heading_style: title
            icon: mdi:radar
          # Served by the integration's own image entity, so this dashboard depends on
          # nothing outside Home Assistant. picture-entity refetches when the entity's
          # image_last_updated changes, which the integration sets on each rebuild.
          - type: picture-entity
            entity: image.cfa_pager_rain_radar
            show_state: false
            show_name: false
            camera_view: auto
